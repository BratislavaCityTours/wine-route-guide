<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Small Carpathian Wine Route — Audio Guide</title>
<meta name="description" content="Official audio guide for the Small Carpathian Wine Route tour by Bratislava City Tours.">
<meta name="theme-color" content="#E23B2E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  /* Bratislava City Tours brand */
  --brand:#E23B2E;         /* logo red */
  --brand-orange:#F58220;  /* logo orange */
  --brand-dark:#A81E14;    /* deep red for depth */
  --brand-ink:#5E1109;
  --gold-lt:#FFE3C4;
  --paper:#FBF7F3;
  --card:#FFFFFF;
  --ink:#2A2320;
  --ink-soft:#736861;
  --line:#EADFD6;
  --radius:16px;
  --shadow:0 2px 10px rgba(94,17,9,.10);
  --shadow-lift:0 6px 22px rgba(94,17,9,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--paper);color:var(--ink);min-height:100vh;line-height:1.55;
}
.serif{font-family:Georgia,"Times New Roman",serif}
img{display:block}

/* ---------- Header ---------- */
header{
  background:#FFFFFF;
  color:var(--ink);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;
  position:sticky;top:0;z-index:20;
  border-bottom:3px solid transparent;
  border-image:linear-gradient(90deg,var(--brand) 0%,var(--brand-orange) 100%) 1;
  box-shadow:0 1px 8px rgba(94,17,9,.07);
}
header .row{display:flex;align-items:center;gap:12px}
.head-main{flex:1;min-width:0}
.logo{height:30px;width:auto;max-width:210px;margin-bottom:5px;object-fit:contain}
header .brand{
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brand);margin-bottom:3px;font-weight:700;
}
header h1{font-size:1.12rem;font-weight:700;line-height:1.25;color:var(--brand-ink)}
.lang-chip{
  background:var(--paper);border:1px solid var(--line);
  color:var(--brand);border-radius:999px;padding:6px 12px;
  font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;
}
.back-btn{
  background:none;border:none;color:var(--brand);font-size:1rem;font-weight:600;
  cursor:pointer;padding:6px 4px 6px 0;display:none;align-items:center;gap:4px;
}

/* ---------- Layout ---------- */
main{max-width:620px;margin:0 auto;padding:18px 14px 150px}
.view{display:none}
.view.active{display:block}
.section-label{
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brand);margin:4px 0 14px;font-weight:700;
}

/* ---------- Language picker ---------- */
.lang-title{text-align:center;margin:26px 0 6px;font-size:1.35rem}
.lang-sub{text-align:center;color:var(--ink-soft);font-size:.88rem;margin-bottom:22px}
.lang-grid{display:flex;flex-direction:column;gap:12px}
.lang-btn{
  display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
  font-size:1.05rem;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%;
}
.lang-btn .flag{font-size:1.5rem}

/* ---------- Card (shared by stops + tracks) ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;
  transition:box-shadow .18s ease,transform .18s ease;
}
.card:active{transform:scale(.99)}
.card.playing{border-color:var(--brand);box-shadow:var(--shadow-lift)}

/* media strip */
.media{
  position:relative;aspect-ratio:16/9;
  background:linear-gradient(140deg,var(--brand) 0%,var(--brand-dark) 70%,var(--brand-ink) 100%);
  overflow:hidden;
}
.media img{width:100%;height:100%;object-fit:cover}
.media .ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.media .ph .ph-num{
  font-family:Georgia,serif;font-size:3.4rem;font-weight:700;
  color:rgba(255,255,255,.32);line-height:1;
}
.media .ph svg{position:absolute;right:-14px;bottom:-18px;opacity:.16}
.dur-pill{
  position:absolute;top:10px;right:10px;
  background:rgba(60,12,6,.74);backdrop-filter:blur(6px);
  color:#F5E9DC;border-radius:999px;padding:5px 11px;
  font-size:.72rem;font-weight:600;display:flex;align-items:center;gap:6px;
}
.dur-pill .bars{display:flex;align-items:flex-end;gap:2px;height:11px}
.dur-pill .bars i{width:2.5px;background:var(--brand-orange);border-radius:1px;display:block}
.dur-pill .bars i:nth-child(1){height:5px}
.dur-pill .bars i:nth-child(2){height:11px}
.dur-pill .bars i:nth-child(3){height:7px}
.card.playing .dur-pill .bars i{animation:eq .9s ease-in-out infinite alternate}
.card.playing .dur-pill .bars i:nth-child(2){animation-delay:.15s}
.card.playing .dur-pill .bars i:nth-child(3){animation-delay:.3s}
@keyframes eq{from{height:3px}to{height:11px}}
@media (prefers-reduced-motion:reduce){.card.playing .dur-pill .bars i{animation:none}}

/* card body row */
.card-body{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.badge{
  flex:0 0 30px;height:30px;border-radius:50%;
  border:1.5px solid var(--brand);color:var(--brand);background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:.85rem;font-weight:700;
}
.card.playing .badge{background:var(--brand);color:#fff;border-color:var(--brand)}
.card-title{flex:1;min-width:0;font-size:1rem;font-weight:600;line-height:1.3}
.card-sub{font-size:.78rem;color:var(--ink-soft);font-weight:400;margin-top:1px}
.card-meta{font-size:.7rem;color:var(--brand-orange);font-weight:700;white-space:nowrap}
.chev{color:#C9BCA8;font-size:1.15rem}
.text-toggle{
  background:none;border:none;color:var(--brand);font-size:.75rem;
  font-weight:700;cursor:pointer;padding:6px;white-space:nowrap;
}
.track-text{display:none;padding:0 14px 16px;border-top:1px solid var(--line)}
.track-text.open{display:block}
.track-text p{font-size:.9rem;color:#463B42;margin-top:12px}
.no-audio-note{font-size:.76rem;color:var(--gold);padding:0 14px 12px;display:none;font-weight:600}

/* ---------- Stop view ---------- */
.stop-hero{margin-bottom:14px}
.stop-hero h2{font-size:1.4rem;line-height:1.25}
.stop-hero p{color:var(--ink-soft);font-size:.86rem;margin-top:3px}
.castle-hint{
  background:#FFF3E8;border-left:4px solid var(--brand-orange);border-radius:6px;
  padding:10px 12px;font-size:.8rem;color:#8A3B12;margin-bottom:14px;
}

/* ---------- Offline ---------- */
.offline-box{
  margin-top:20px;background:var(--card);border:1px dashed var(--brand-orange);
  border-radius:var(--radius);padding:16px;text-align:center;
}
.offline-box p{font-size:.8rem;color:var(--ink-soft);margin-bottom:10px}
.btn-vine{background:linear-gradient(90deg,var(--brand),var(--brand-orange));color:#fff;border:none;border-radius:999px;padding:11px 22px;font-size:.88rem;font-weight:600;cursor:pointer}
.btn-vine[disabled]{opacity:.55}
#dl-progress{font-size:.8rem;color:var(--brand);margin-top:8px;font-weight:600}
.hint{font-size:.74rem;color:var(--ink-soft);text-align:center;margin-top:16px}

/* ---------- Player ---------- */
#player{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:linear-gradient(120deg,var(--brand-dark),var(--brand-ink));color:#FFF1E6;
  padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);
  display:none;box-shadow:0 -4px 16px rgba(0,0,0,.25);
}
#player.visible{display:block}
.p-row{display:flex;align-items:center;gap:10px;max-width:620px;margin:0 auto}
.p-info{flex:1;min-width:0}
.p-label{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-lt)}
.p-title{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-btn{background:none;border:none;color:#FFF1E6;font-size:1.35rem;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.p-btn.main{background:#fff;color:var(--brand);border-radius:50%;font-size:1.05rem}
#seek{width:100%;margin-top:6px;accent-color:var(--brand-orange);height:4px}
.p-time{display:flex;justify-content:space-between;font-size:.66rem;color:var(--gold-lt);max-width:620px;margin:2px auto 0}
</style>
</head>
<body>

<header>
  <div class="row">
    <button class="back-btn" id="backBtn">‹ <span id="backLabel">Back</span></button>
    <div class="head-main">
      <img src="images/logo.png" alt="Bratislava City Tours" class="logo"
           onerror="this.style.display='none';document.getElementById('brandText').style.display='block';">
      <div class="brand" id="brandText" style="display:none">Bratislava City Tours</div>
      <h1 class="serif" id="headerTitle">Small Carpathian Wine Route</h1>
    </div>
    <button class="lang-chip" id="langChip" style="display:none">EN ▾</button>
  </div>
</header>

<main>
  <section class="view active" id="view-lang">
    <h2 class="lang-title serif">Choose your language</h2>
    <p class="lang-sub">Elija su idioma · Choisissez votre langue · Scegli la tua lingua · Wählen Sie Ihre Sprache</p>
    <div class="lang-grid">
      <button class="lang-btn" data-lang="en"><span class="flag"><svg width="26" height="18" viewBox="0 0 60 40"><clipPath id="a"><rect width="60" height="40" rx="3"/></clipPath><g clip-path="url(#a)"><rect width="60" height="40" fill="#012169"/><path d="M0 0l60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0l60 40M60 0L0 40" stroke="#C8102E" stroke-width="4"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="12"/><path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="7"/></g></svg></span> English</button>
      <button class="lang-btn" data-lang="es"><span class="flag"><svg width="26" height="18" viewBox="0 0 60 40"><clipPath id="b"><rect width="60" height="40" rx="3"/></clipPath><g clip-path="url(#b)"><rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/></g></svg></span> Español</button>
      <button class="lang-btn" data-lang="fr"><span class="flag">🇫🇷</span> Français</button>
      <button class="lang-btn" data-lang="it"><span class="flag">🇮🇹</span> Italiano</button>
      <button class="lang-btn" data-lang="de"><span class="flag">🇩🇪</span> Deutsch</button>
    </div>
  </section>

  <section class="view" id="view-stops">
    <div class="section-label" id="stopsLabel">Tour stops</div>
    <div id="stopList"></div>
    <div class="offline-box">
      <p id="offlineText">Download the audio before departure — mobile signal can be weak along the route.</p>
      <button class="btn-vine" id="dlBtn">Download audio for offline use</button>
      <div id="dl-progress"></div>
    </div>
    <p class="hint" id="installHint"></p>
  </section>

  <section class="view" id="view-stop">
    <div class="stop-hero">
      <h2 class="serif" id="stopTitle"></h2>
      <p id="stopSubtitle"></p>
    </div>
    <div class="castle-hint" id="castleHint" style="display:none"></div>
    <div id="trackList"></div>
  </section>
</main>

<div id="player">
  <div class="p-row">
    <button class="p-btn" id="prevBtn">⏮</button>
    <button class="p-btn main" id="playBtn">▶</button>
    <button class="p-btn" id="nextBtn">⏭</button>
    <div class="p-info">
      <div class="p-label" id="pLabel">Now playing</div>
      <div class="p-title" id="pTitle"></div>
    </div>
  </div>
  <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
  <div class="p-time"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* ================= Small Carpathian Wine Route — Audio Guide =================
   Content : content/<lang>.json
   Audio   : audio/<lang>/<trackId>.mp3
   Photos  : images/<stopId>.jpg   and   images/<trackId>.jpg   (both optional)
             If a photo is missing, an elegant placeholder is shown instead.
============================================================================= */

/* Languages that are FINISHED and live. Add codes here as they are completed,
   e.g. ["en","es"]. With one code, the language picker is skipped. */
const AVAILABLE = ["en","es"];

let content=null, lang=null, currentStop=null, queue=[], qIndex=-1;
const $ = id => document.getElementById(id);
const audio = $("audio");

const VINE_SVG = `<svg width="150" height="150" viewBox="0 0 100 100" fill="none">
<circle cx="34" cy="34" r="9" fill="#FFFFFF"/><circle cx="54" cy="34" r="9" fill="#FFFFFF"/>
<circle cx="24" cy="52" r="9" fill="#FFFFFF"/><circle cx="44" cy="52" r="9" fill="#FFFFFF"/>
<circle cx="64" cy="52" r="9" fill="#FFFFFF"/><circle cx="34" cy="70" r="9" fill="#FFFFFF"/>
<circle cx="54" cy="70" r="9" fill="#FFFFFF"/><circle cx="44" cy="86" r="9" fill="#FFFFFF"/>
<rect x="41" y="6" width="5" height="22" rx="2" fill="#FFFFFF"/>
<path d="M46 10 L70 2 L64 22 Z" fill="#FFFFFF"/></svg>`;

/* ---------- Navigation ---------- */
function show(viewId){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $(viewId).classList.add("active");
  const isLang = viewId==="view-lang";
  $("langChip").style.display = (isLang || AVAILABLE.length===1) ? "none" : "inline-block";
  $("backBtn").style.display = viewId==="view-stop" ? "flex" : "none";
  window.scrollTo(0,0);
}

/* ---------- Media block (photo or placeholder) ---------- */
function mediaHTML(imgPath, number, duration){
  const pill = duration
    ? `<span class="dur-pill"><span class="bars"><i></i><i></i><i></i></span>${duration}</span>` : "";
  return `<div class="media">
      <div class="ph"><span class="ph-num">${number}</span>${VINE_SVG}</div>
      <img src="${imgPath}" alt="" loading="eager"
           onload="this.style.opacity=1" onerror="this.remove()"
           style="position:absolute;inset:0;opacity:0;transition:opacity .3s">
      ${pill}
    </div>`;
}

/* ---------- Language ---------- */
async function setLang(l){
  try{
    const res = await fetch(`content/${l}.json`);
    if(!res.ok) throw new Error();
    content = await res.json();
  }catch(e){ alert("This language is not available yet."); return; }
  lang=l; localStorage.setItem("wr_lang",l);
  $("langChip").textContent = l.toUpperCase()+" ▾";
  $("headerTitle").textContent = content.appTitle;
  $("stopsLabel").textContent  = content.ui.stops;
  $("dlBtn").textContent       = content.ui.downloadOffline;
  $("installHint").textContent = content.ui.installHint;
  $("backLabel").textContent   = content.ui.back;
  $("pLabel").textContent      = content.ui.nowPlaying;
  renderStops(); show("view-stops"); refreshOfflineStatus();
}

/* ---------- Stop list ---------- */
function stopDuration(s){
  let sec = 0;
  for(const t of s.tracks){
    if(!t.duration) return null;
    // duration looks like "2:31 mins" - parseInt ignores the trailing word
    const parts = t.duration.split(":");
    const m = parseInt(parts[0], 10);
    const x = parseInt(parts[1], 10);
    if(isNaN(m) || isNaN(x)) return null;
    sec += m*60 + x;
  }
  const m = Math.max(1, Math.round(sec/60));
  return m + " " + (m===1 ? content.ui.min : content.ui.mins);
}
function renderStops(){
  const el = $("stopList"); el.innerHTML="";
  content.stops.forEach((s,i)=>{
    const n = s.tracks.length;
    const img = s.image || `images/${s.id}.jpg`;
    const card = document.createElement("div");
    card.className="card";
    card.innerHTML = mediaHTML(img, i+1, stopDuration(s)) + `
      <div class="card-body">
        <div class="badge">${i+1}</div>
        <div class="card-title">${s.title}<div class="card-sub">${s.subtitle||""}</div></div>
        <div class="card-meta">${n} ${n===1?content.ui.track:content.ui.tracks}</div>
        <div class="chev">›</div>
      </div>`;
    card.onclick = ()=>openStop(s);
    el.appendChild(card);
  });
}

/* ---------- Track list ---------- */
function openStop(s){
  currentStop = s;
  $("stopTitle").textContent = s.title;
  $("stopSubtitle").textContent = s.subtitle||"";
  const hint = $("castleHint");
  if(s.mode==="rooms"){ hint.textContent = content.ui.castleHint; hint.style.display="block"; }
  else hint.style.display="none";

  const el = $("trackList"); el.innerHTML="";
  s.tracks.forEach((t,i)=>{
    const img = t.image || `images/${t.id}.jpg`;
    const item = document.createElement("div");
    item.className="card"; item.id="trk-"+t.id;
    item.innerHTML = mediaHTML(img, i+1, t.duration) + `
      <div class="card-body">
        <div class="badge">${i+1}</div>
        <div class="card-title">${t.title}</div>
        <button class="text-toggle">${content.ui.readText}</button>
      </div>
      <div class="no-audio-note">${content.ui.audioComingSoon}</div>
      <div class="track-text">${t.text.map(p=>`<p>${p}</p>`).join("")}</div>`;

    item.querySelector(".card-body").onclick = e=>{
      if(e.target.classList.contains("text-toggle")) return;
      playTrack(s,i);
    };
    item.querySelector(".media").onclick = ()=> playTrack(s,i);
    item.querySelector(".text-toggle").onclick = e=>{
      e.stopPropagation();
      const box = item.querySelector(".track-text");
      box.classList.toggle("open");
      e.target.textContent = box.classList.contains("open") ? content.ui.hideText : content.ui.readText;
    };
    el.appendChild(item);
  });
  show("view-stop");
}

/* ---------- Player ---------- */
const audioUrl = t => `audio/${lang}/${t.id}.mp3`;
function playTrack(stop, idx){ queue = stop.tracks; qIndex = idx; loadCurrent(true); }

function loadCurrent(autoplay){
  const t = queue[qIndex]; if(!t) return;
  document.querySelectorAll(".card").forEach(x=>x.classList.remove("playing"));
  const el = $("trk-"+t.id); if(el) el.classList.add("playing");
  $("pTitle").textContent = t.title;
  $("player").classList.add("visible");
  audio.src = audioUrl(t); audio.load();
  if(autoplay) audio.play().catch(()=>{});
  document.querySelectorAll(".no-audio-note").forEach(n=>n.style.display="none");
}

audio.addEventListener("error", ()=>{
  const t = queue[qIndex]; if(!t) return;
  const el = $("trk-"+t.id); if(!el) return;
  el.querySelector(".no-audio-note").style.display="block";
  const box = el.querySelector(".track-text");
  if(!box.classList.contains("open")){
    box.classList.add("open");
    el.querySelector(".text-toggle").textContent = content.ui.hideText;
  }
  $("playBtn").textContent="▶";
});
audio.addEventListener("ended", ()=>{
  if(currentStop && currentStop.mode==="playlist" && qIndex < queue.length-1){ qIndex++; loadCurrent(true); }
  else $("playBtn").textContent="▶";
});
audio.addEventListener("play",  ()=> $("playBtn").textContent="⏸");
audio.addEventListener("pause", ()=> $("playBtn").textContent="▶");
audio.addEventListener("timeupdate", ()=>{
  if(audio.duration){
    $("seek").value=(audio.currentTime/audio.duration)*100;
    $("tCur").textContent=fmt(audio.currentTime);
    $("tDur").textContent=fmt(audio.duration);
  }
});
$("seek").addEventListener("input", e=>{ if(audio.duration) audio.currentTime=(e.target.value/100)*audio.duration; });
$("playBtn").onclick = ()=> audio.paused ? audio.play().catch(()=>{}) : audio.pause();
$("prevBtn").onclick = ()=>{ if(qIndex>0){ qIndex--; loadCurrent(true);} };
$("nextBtn").onclick = ()=>{ if(qIndex<queue.length-1){ qIndex++; loadCurrent(true);} };
const fmt = s => { s=Math.floor(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

/* ---------- Offline: download EVERYTHING ---------- */
function offlineAssets(){
  // the app itself
  const list = ["./", "index.html", "manifest.json", `content/${lang}.json`,
                "icons/icon-192.png", "icons/icon-512.png", "images/logo.png"];
  // every photo (missing ones are skipped automatically)
  content.stops.forEach(s=>{
    list.push(s.image || `images/${s.id}.jpg`);
    s.tracks.forEach(t=>{
      list.push(t.image || `images/${t.id}.jpg`);
      list.push(`audio/${lang}/${t.id}.mp3`);
    });
  });
  return [...new Set(list)];
}

async function downloadOffline(){
  if(!("caches" in window)){ alert("Offline storage is not supported in this browser."); return; }
  const btn=$("dlBtn"), prog=$("dl-progress");
  btn.disabled=true;
  const cache = await caches.open("wr-offline-"+lang);
  const all = offlineAssets();
  let ok=0, failed=0;

  for(let i=0;i<all.length;i++){
    prog.textContent = `${content.ui.downloading} ${Math.round(((i+1)/all.length)*100)}%`;
    try{
      const res = await fetch(all[i], {cache:"reload"});
      if(res.ok){ await cache.put(all[i], res.clone()); ok++; }
      else failed++;               // e.g. a photo you haven't added yet
    }catch(e){ failed++; }
  }

  prog.textContent = content.ui.offlineReady;
  localStorage.setItem("wr_offline_"+lang, String(ok));
  btn.disabled=false;
  console.log(`offline: ${ok} cached, ${failed} unavailable`);
}
$("dlBtn").onclick = downloadOffline;
function refreshOfflineStatus(){
  $("dl-progress").textContent = localStorage.getItem("wr_offline_"+lang) ? content.ui.offlineReady : "";
}

/* ---------- Wiring ---------- */
document.querySelectorAll(".lang-btn").forEach(b=>{
  if(AVAILABLE.includes(b.dataset.lang)) b.onclick = ()=> setLang(b.dataset.lang);
  else b.remove();
});
$("langChip").onclick = ()=>{ audio.pause(); $("player").classList.remove("visible"); show("view-lang"); };
$("backBtn").onclick = ()=> show("view-stops");

if(AVAILABLE.length===1){ $("langChip").style.display="none"; setLang(AVAILABLE[0]); }
else{
  const saved = localStorage.getItem("wr_lang");
  if(saved && AVAILABLE.includes(saved)) setLang(saved);
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
